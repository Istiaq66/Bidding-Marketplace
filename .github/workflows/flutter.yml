on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pinned Flutter version
        id: fvm
        run: |
          if [ -f .fvmrc ]; then
            VERSION=$(jq -r '.flutter // .flutterSdkVersion // empty' .fvmrc 2>/dev/null || true)
          fi
          if [ -z "${VERSION}" ]; then
            VERSION="stable"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run unit + widget tests
        run: flutter test --reporter expanded